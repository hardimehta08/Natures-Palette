<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content='IE=edge' http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="../css/login.css">
</head>
<body>
    <section class="login-wrapper">
        <a href="index.html" class="logo"><img src="../ad-images/logo/logo.png" alt="MS Admin Panel" width="150" style="border-radius: 50%;"/></a>
        <div class="login-form">
            <div class="row">
                <div class="row1">
                    <div class="pagetitle mb-4">
                        <h2>Recover Your Password</h2>
                        <span>Please enter your email address to receive password reset instructions.</span>
                    </div>
                    <form id="forgotPasswordForm">
                        <div class="form-group">
                            <label>Email Id</label>
                            <input type="email" id="email" class="form-control" placeholder="john.doe@domain.com" required>
                        </div>
                        <div id="response-message" style="color: red; display: none;"></div>
                        <div class="forgot">
                            <a href="login.html" class="btn btn-outline-primary waves-effect" style="padding: 21px 30px;width: 40%;">Back To Login</a>
                            <button type="submit" class="btn btn-primary waves-effect waves-primary">Send Reset Link</button>
                        </div>
                    </form>

                    <!-- Reset Password Form (hidden until token is present) -->
                    <form id="resetPasswordForm" style="display: none;">
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                        </div>
                        <div id="reset-message" style="color: red; display: none;"></div>
                        <div class="forgot">
                            <button type="submit" class="btn btn-primary waves-effect waves-primary">Reset Password</button>
                        </div>
                    </form>
                </div>
                <div class="row2">
                    <img src="../ad-images/login-mockup.svg" width="300" alt="">
                </div>
            </div>
        </div>
    </section>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get("email");
        const token = urlParams.get("token");

        const forgotForm = document.getElementById("forgotPasswordForm");
        const resetForm = document.getElementById("resetPasswordForm");
        const responseMessage = document.getElementById("response-message");
        const resetMessage = document.getElementById("reset-message");

        if (token && email) {
            forgotForm.style.display = "none";
            resetForm.style.display = "block";
            document.querySelector(".pagetitle h2").textContent = "Reset Your Password";
            document.querySelector(".pagetitle span").textContent = "Enter your new password below.";
        }

        forgotForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            responseMessage.style.display = "none";

            const emailValue = document.getElementById("email").value.trim();

            if (!emailValue) {
                responseMessage.textContent = "Email is required!";
                responseMessage.style.display = "block";
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailValue)) {
                responseMessage.textContent = "Invalid email format!";
                responseMessage.style.display = "block";
                return;
            }

            try {
                const response = await fetch("/delivery/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: emailValue })
                });

                const result = await response.json();

                if (result.success) {
                    responseMessage.style.color = "green";
                    responseMessage.textContent = result.message;
                    responseMessage.style.display = "block";
                } else {
                    responseMessage.style.color = "red";
                    responseMessage.textContent = result.message || "Failed to send reset email.";
                    responseMessage.style.display = "block";
                }
            } catch (error) {
                console.error("Error sending reset request:", error);
                responseMessage.textContent = "Server error. Please try again.";
                responseMessage.style.display = "block";
            }
        });

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            resetMessage.style.display = "none";

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                resetMessage.textContent = "Passwords do not match!";
                resetMessage.style.display = "block";
                return;
            }

            if (newPassword.length < 8) {
                resetMessage.textContent = "Password must be at least 8 characters long!";
                resetMessage.style.display = "block";
                return;
            }

            try {
                const response = await fetch("/delivery/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, token, newPassword, confirmPassword })
                });

                const result = await response.json();

                if (result.success) {
                    resetMessage.style.color = "green";
                    resetMessage.textContent = result.message;
                    resetMessage.style.display = "block";
                    setTimeout(() => window.location.href = result.redirect, 2000);
                } else {
                    resetMessage.style.color = "red";
                    resetMessage.textContent = result.message || "Failed to reset password.";
                    resetMessage.style.display = "block";
                }
            } catch (error) {
                console.error("Error resetting password:", error);
                resetMessage.textContent = "Server error. Please try again.";
                resetMessage.style.display = "block";
            }
        });
    </script>
</body>
</html>
