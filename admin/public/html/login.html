<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content='IE=edge' http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Login Panel</title>
    <!-- Font Awesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="../css/login.css">
</head>

<body>
    <!-- ########## START: Login Form ########## -->
    <section class="login-wrapper">
        <a href="index.html" class="logo"><img src="../ad-images/logo/logo.png" alt="Admin Panel" width="150" style="border-radius: 50%;" /></a>
        <div class="login-form">
            <div class="row">
                <div class="row1">
                    <div class="pagetitle">
                        <h2>Login to Your Account</h2>
                    </div>
                    <form id="loginForm">
                        <div class="form-group">
                            <div class="input-group">
                                <input id="email" type="text" class="form-control" placeholder="" required>
                                <label for="email" class="floating-label">Email Id</label>
                            </div>
                        </div>
                       
                        <div class="form-group">
                            <div class="input-group">
                                <input id="password" type="password" class="form-control password__box" placeholder="" required>
                                <label for="password" class="floating-label">Password</label>
                            </div>
                        </div>
                        
                        <div id="error-message" style="color: red; display: none;"></div>
                        <div class="forgot">
                            <a href="forgot.html" class="btn-link">Forgot password?</a>
                            <button type="submit" class="btn btn-primary ">Login</button>
                        </div>
                        <hr>
                        <a href="register.html" class="btn btn-outline-primary" style="font-size: 1.2rem;">Create an account</a>
                    </form>
                </div>
                <div class="row2">
                    <img src="../ad-images/login-mockup.png" alt="">
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMessage = document.getElementById("error-message");

            errorMessage.style.display = "none"; // Hide error message initially

            if (!email || !password) {
                errorMessage.textContent = "Both fields are required!";
                errorMessage.style.display = "block";
                return;
            }

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const result = await response.json();

                if (result.success) {
                    alert("Login Successful!");
                    window.location.href = "/index.html"; // Redirect after login
                } else {
                    errorMessage.textContent = result.error || "Login failed. Please try again.";
                    errorMessage.style.display = "block";
                }
            } catch (error) {
                console.error("Login error:", error);
                errorMessage.textContent = "An error occurred. Please try again.";
                errorMessage.style.display = "block";
            }
        });
    </script>
</body>

</html>
