<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #fffce2;
      }
      .reset-container {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      .reset-container h2 {
        margin-bottom: 20px;
      }
      .reset-container input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .reset-container button {
        width: 95%;
        padding: 10px;
        background-color: #007bff;
        border: none;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
      }
      .reset-container button:hover {
        background-color: #0056b3;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="reset-container">
      <h2>Reset Password</h2>
      <form id="resetForm">
        <input
          type="password"
          id="newPassword"
          placeholder="New Password"
          required
        />
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          required
        />
        <button type="submit">Reset Password</button>
        <p class="error" id="errorMessage"></p>
      </form>
    </div>

    <script>
      document
        .getElementById("resetForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const newPassword = document
            .getElementById("newPassword")
            .value.trim();
          const confirmPassword = document
            .getElementById("confirmPassword")
            .value.trim();
          const errorMessage = document.getElementById("errorMessage");

          errorMessage.textContent = "";

          if (newPassword !== confirmPassword) {
            errorMessage.textContent = "Passwords do not match.";
            return;
          }

          const urlParams = new URLSearchParams(window.location.search);
          const email = urlParams.get("email");

          if (!email) {
            errorMessage.textContent = "Invalid or missing email parameter.";
            return;
          }

          // Send the reset request to the server
          fetch("/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, newPassword, confirmPassword }),
          })
            .then((response) => {
              if (!response.ok) {
                return response.text().then((text) => {
                  throw new Error(text);
                });
              }
              return response.json();
            })
            .then((data) => {
              alert(data.message || "Password reset successful!");
              // Redirect to login page or any other page
              window.location.href = "/login.html";
            })
            .catch((error) => {
              errorMessage.textContent = "Error: " + error.message;
            });
        });

      async function loadNav() {
        try {
          const response = await fetch("/header");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("nav").innerHTML = data;
          console.log("Navigation loaded successfully");
        } catch (error) {
          console.error("Error loading navigation:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("nav").innerHTML =
            "<p>Failed to load navigation.</p>";
        }
      }

      document.addEventListener("DOMContentLoaded", loadNav);
    </script>
    <script src="../js2/search.js"></script>
    <script src="../js2/reset.js"></script>
  </body>
</html>
