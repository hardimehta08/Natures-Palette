<html>
  <head>
    <title>login</title>
    <!-- Font awsome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <!-- Google Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400..700&family=Roboto+Condensed:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
    <link rel="stylesheet" type="text/css" href="../css/login.css" />
  </head>
  <body>
    <div class="overlay" data-overlay></div>
    <!-- Header section starts -->
    <div id="nav"></div>
    <!-- Header section ends -->
    <section>
      <div id="login-form" class="login-page">
        <!-- <img src="./images/icon/20.jpg" alt=""> -->
        <div class="form-box">
          <div class="button-box" style="display: flex">
            <div id="btn"></div>
            <button type="button" class="toggle-btn" onclick="login()">
              Login
            </button>
            <button type="button" class="toggle-btn" onclick="register()">
              Register
            </button>
          </div>

          <form id="login" class="input-group-login" action="/" method="POST">
            <input type="hidden" id="redirectUrl" name="redirectUrl" value="" />
            <input
              type="email"
              class="input-field"
              placeholder="Email"
              name="email"
              id="cemail"
              required
            />
            <div id="error_message_email"></div>
            <input
              type="password"
              class="input-field"
              placeholder="Password"
              name="password"
              id="cpassword"
              required
            />
            <button type="submit" class="submit-btn">Login</button><br />
            <div class="forgot">
              <a href="/forgot">Forgot Password ?</a>
            </div>
            <br />
            <center>
              <a href="#" onclick="register()"> New User ? Then Register !</a>
            </center>
          </form>

          <form id="register" class="input-group-register">
            <input
              type="text"
              class="input-field"
              placeholder="Username"
              name="username"
              id="un"
              required
            />
            <div id="error_message1"></div>
            <input
              type="email"
              class="input-field"
              placeholder="Email"
              name="email"
              id="em"
              required
            />
            <div id="error_message2"></div>
            <input
              type="num"
              class="input-field"
              placeholder="Mobile"
              name="mobile"
              id="mb"
              required
            />
            <div id="error_message3"></div>
            <input
              type="text"
              class="input-field"
              placeholder="Address"
              name="address"
              id="ad"
              required
            />
            <div id="error_message4"></div>
            <input
              type="text"
              class="input-field"
              placeholder="Pincode"
              name="pincode"
              id="pc"
              required
            />
            <div id="error_message5"></div>
            <input
              type="password"
              class="input-field"
              placeholder="Password"
              name="password"
              id="pw"
              required
            />
            <div id="error_message6"></div>
            <button
              type="submit"
              class="submit-btn"
              onsubmit="return validateForm()"
              id="registerbtn"
            >
              Register
            </button>
            <div id="error_message7"></div>
          </form>
        </div>
      </div>
    </section>

    <script>
      var x = document.getElementById("login");
      var y = document.getElementById("register");
      var z = document.getElementById("btn");

      function register() {
        x.style.left = "-400px";
        y.style.left = "50px";
        z.style.left = "110px";
      }
      function login() {
        x.style.left = "50px";
        y.style.left = "450px";
        z.style.left = "0px";
      }
    </script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
    <script src="../js/main.js"></script>
    <script src="../js2/headerscript.js"></script>
    <script src="../js2/login.js"></script>
  </body>
</html>
