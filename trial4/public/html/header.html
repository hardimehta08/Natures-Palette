<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature's Palette</title>
    <!-- Font awesome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <!-- Google Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400..700&family=Roboto+Condensed:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- custom css link -->
    <link rel="stylesheet" href="../css/style.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
    <div class="overlay" data-overlay></div>
    <!-- Header section starts -->
    <header id="header">
      <div class="header-main">
        <div class="header-container">
          <a href="/" class="header-logo">
            <img
              src="../images/logo/logo.png"
              alt="Nature's Palette logo"
              width="70"
              height="70"
            />
            <h1>Nature's <span>Palette</span></h1>
          </a>
          <div class="header-search-container">
            <div class="search-form">
              <form action="" method="">
                <input
                  type="search"
                  name="search"
                  id="search"
                  class="search-field input"
                  placeholder="Type keywords  & press enter......"
                  oninput="fetchKeywords()"
                  autocomplete="off"
                />
                <button type="submit" class="search-btn">
                  <ion-icon name="search-outline"></ion-icon>
                </button>
              </form>
              <ul id="dropdown-menu" style="display: none"></ul>
              <!-- Close Icon -->
              <div class="closeIcon"></div>
            </div>
          </div>
          <script src="../js2/search.js"></script>
          <div class="header-user-actions">
            <button class="action-btn" id="user-btn">
              <a href="/login.html">
                <ion-icon name="person-outline"></ion-icon>
              </a>
            </button>
            <button class="action-btn">
              <a href="/wishlist.html">
                <ion-icon name="heart-outline"></ion-icon>
                <span class="count" id="wishlist_count"></span>
              </a>
            </button>
            <button class="action-btn">
              <a href="/cart.html">
                <ion-icon name="bag-handle-outline"></ion-icon>
                <span class="count" id="cart_count"></span>
              </a>
            </button>
          </div>
        </div>
      </div>
      <nav class="desktop-navigation-menu">
        <div class="container">
          <ul class="desktop-menu-category-list">
            <li class="menu-category">
              <a href="/" class="menu-title">Home</a>
            </li>
            <li id="dynamic-categories-container" class="menu-category">
              <a href="#" class="menu-title">Categories</a>
              <div class="dropdown-panel"></div>
            </li>
            <li class="menu-category">
              <a href="#about" class="menu-title">About Us</a>
            </li>
            <li class="menu-category">
              <a href="./html/contactus.html" class="menu-title">Contact Us</a>
            </li>
            <li class="menu-category">
              <a href="html/myaccount.html" class="menu-title">My Account</a>
            </li>
          </ul>
        </div>
      </nav>
      <div class="mobile-bottom-navigation">
        <button class="action-btn" data-mobile-menu-open-btn>
          <ion-icon name="menu-outline"></ion-icon>
        </button>
        <button class="action-btn">
          <ion-icon name="person-outline"></ion-icon>
        </button>
        <button class="action-btn">
          <ion-icon name="heart-outline"></ion-icon>
          <span class="count">0</span>
        </button>
        <button class="action-btn">
          <ion-icon name="bag-handle-outline"></ion-icon>
          <span class="count">0</span>
        </button>
      </div>
      <nav class="mobile-navigation-menu has-scrollbar" data-mobile-menu>
        <div class="menu-top">
          <h2 class="menu-title">Menu</h2>
          <button class="menu-close-btn" data-mobile-menu-close-btn>
            <ion-icon name="close-outline"></ion-icon>
          </button>
        </div>
        <ul id="dynamic-mobile-menu" class="mobile-menu-category-list">
          <li class="menu-category">
            <a href="#about" class="menu-title">About Us</a>
          </li>
          <li class="menu-category">
            <a href="contactus" class="menu-title">Contact Us</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Include the main.js script at the end of the body -->
    <script src="../js/main.js"></script>
  </body>
</html>
