<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Feedback</title></head
  ><style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Open-Sans", sans-serif;
      letter-spacing: 0.6px;
    }

    body {
      min-height: 100vh;
      background-color: #b1f9e694;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: azure;
      border-radius: 12px;
      box-shadow: 4px 4px 25px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .card-header {
      background-color: #e1ff00;
      text-align: center;
      padding: 24px 32px;
    }

    .card-header {
      font-size: 1.8em;
      font-weight: bold;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 64px;
    }

    .stars {
      margin-bottom: 40px;
    }

    .stars i {
      font-size: 2.6em;
      margin: 8px;
      cursor: pointer;
      color: #292f3d;
      transition: color 0.5s;
    }

    .card.one .stars i:nth-child(-n + 1) {
      color: #ffcf87;
    }

    .card.two .stars i:nth-child(-n + 2) {
      color: #ffcf87;
    }

    .card.three .stars i:nth-child(-n + 3) {
      color: #ffcf87;
    }

    .card.four .stars i:nth-child(-n + 4) {
      color: #ffcf87;
    }

    .card.five .stars i:nth-child(-n + 5) {
      color: #ffcf87;
    }

    textarea {
      width: 100%;
      background-color: azure;
      border: 2px solid salmon;
      border-radius: 8px;
      padding: 16px;
      resize: none;
      font-size: 1.4em;
      outline: none;
    }

    button.cta {
      width: 80%;
      cursor: pointer;
      outline: none;
      border: none;
      border-radius: 6px;
      padding: 16px;
      margin-top: 32px;
      background: #fde021ab;
      background-size: 300% 100%;
      font-size: 1.4em;
      transition: background-position 0.7s;
    }

    button.cta:hover {
      background-color: #ffdd00;
    }

    .credit a {
      text-decoration: none;
      color: #21d4fd;
    }
  </style>
  <body>
    <div id="nav"></div>
    <div class="card four">
      <div class="card-header">
        <p class="title">Tell us more about the product!</p>
      </div>

      <div class="card-body">
        <div class="stars">
          <i class="fas fa-star" id="one"></i>
          <i class="fas fa-star" id="two"></i>
          <i class="fas fa-star" id="three"></i>
          <i class="fas fa-star" id="four"></i>
          <i class="fas fa-star" id="five"></i>
        </div>
        <textarea rows="10" placeholder="Please, leave a message"></textarea>
        <button class="cta">Provide feedback</button><br />
      </div>
    </div>
    <!-- Footer section  starts-->
    <div id="footer"></div>
    <script>
      const btnScrollToTop = document.querySelector("#btnScrollToTop");
      btnScrollToTop.addEventListener("click", function () {
        window.scrollTo(0, 0);
      });
      async function loadNav() {
        try {
          const response = await fetch("/header");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("nav").innerHTML = data;
          // ("Navigation loaded successfully");
        } catch (error) {
          // console.error("Error loading navigation:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("nav").innerHTML =
            "<p>Failed to load navigation.</p>";
        }
      }
      async function loadFooter() {
        try {
          const response = await fetch("/footer");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("footer").innerHTML = data;
          // console.log("Footer loaded successfully");
        } catch (error) {
          // console.error("Error loading footer:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("footer").innerHTML =
            "<p>Failed to load footer.</p>";
        }
      }
      document.addEventListener("DOMContentLoaded", loadNav);
      document.addEventListener("DOMContentLoaded", loadFooter);
    </script>
    <script src="../js2/feedback.js"></script>
  </body>
</html>
