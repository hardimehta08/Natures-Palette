<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Sub</title>
    <!-- Font awsome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <!-- Google Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- custom css link -->
    <link rel="stylesheet" href="../css/style copy.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- Header section starts -->
    <div id="nav"></div>
    <!-- Header section ends -->

    <!--=============== BREADCRUMB ===============-->
    <section class="breadcrumb">
      <ul class="breadcrumb__list container">
        <li><a href="index.html" class="breadcrumb__link">Home</a></li>
        <li><span class="breadcrumb__link">></span></li>
        <li><span class="breadcrumb__link" id="breadcrumb1"></span></li>
      </ul>
    </section>

    <!-- Hero section  starts-->
    <section class="hero container shopsub">
      <h1 id="heading"></h1>
      <p>Result: <span id="tp"></span></p>
      <p id="info1"></p>
    </section>
    <!-- Hero section  ends-->

    <!-- ##### Shop Area Start ##### -->
    <section class="shop-page">
      <div class="container">
        <div class="shop-page-text">
          <p>All Products</p>
        </div>
      </div>
    </section>
    <!-- ##### Shop Area End ##### -->
    <!-- new arrival section starts -->
    <section class="container section">
      <div class="product-section">
        <div id="product-container" class="grid-container"></div>
      </div>
    </section>

    <h1 id="heading1">You may also like them</h1>
    <div class="product-section">
      <div id="newarrival-container" class="product-container"></div>
    </div>
    <!-- new arrival section ends -->
    <!-- Footer section  starts-->
    <div id="footer"></div>
    <!-- Footer section  ends-->
    <button id="btnScrollToTop">
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script>
      const btnScrollToTop = document.querySelector("#btnScrollToTop");
      btnScrollToTop.addEventListener("click", function () {
        window.scrollTo(0, 0);
      });
      function getRelativePath(filePath) {
        var currentPath = window.location.pathname;
        var depth = currentPath.split("/").length - 1;
        var relativePath = new Array(depth).join("../") + filePath;
        // console.log(relativePath);
        return relativePath;
      }
      async function loadNav() {
        try {
          const response = await fetch("/header");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("nav").innerHTML = data;
          console.log("Navigation loaded successfully");
        } catch (error) {
          console.error("Error loading navigation:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("nav").innerHTML =
            "<p>Failed to load navigation.</p>";
        }
      }
      async function loadFooter() {
        try {
          const response = await fetch("/footer");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("footer").innerHTML = data;
          console.log("Footer loaded successfully");
        } catch (error) {
          console.error("Error loading footer:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("footer").innerHTML =
            "<p>Failed to load footer.</p>";
        }
      }
      document.addEventListener("DOMContentLoaded", loadNav);
      document.addEventListener("DOMContentLoaded", loadFooter);
    </script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
    <script src="../js2/search.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js2/shopsub.js"></script>
  </body>
</html>
