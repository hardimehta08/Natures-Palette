<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature's Palette</title>
    <!-- Font awsome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <!-- Google Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400..700&family=Roboto+Condensed:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- custom css link -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/style copy.css" />
    <style>
      #message {
        margin-bottom: 10px;
        font-size: large;
        color: rgb(18, 137, 40);
      }
      #product-description {
        font-family: QuickSand, sans-serif;
        margin-bottom: 15px;
        font-size: large;
        text-align: justify;
        letter-spacing: 4px;
        word-spacing: 15px;
        line-height: 25px;
      }
      .review {
        background: linear-gradient(
          to left,
          rgb(186, 223, 237),
          rgb(173, 221, 255)
        );
        border: 2px solid black;
        padding: 20px;
        margin: 10px;
      }
      .ul-wrapper > li:hover {
        padding-left: 5px;
        padding-right: 5px;
        background-color: skyblue;
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <section class="product-detail">
      <div class="details container">
        <!-- Left Side - Image Gallery -->
        <div class="image-container">
          <div class="main">
            <img id="featured-image" src="" alt="Featured Product" />
          </div>
          <!-- Small Image Thumbnails -->
          <div class="small-Card" id="thumbnail-container">
            <!-- Thumbnails will be inserted dynamically -->
          </div>
        </div>

        <!-- Right Side - Product Info -->
        <div class="product-info">
          <h3 id="product-title"></h3>
          <h5 id="product-price">Price :&nbsp;&nbsp;</h5>
          <label for="quantity">Quantity:</label>
          <div class="product__quantity">
            <input type="number" id="quantity" min="1" />
          </div>
          <br /><br />
          <div id="message"></div>

          <!-- Buttons -->
          <div class="cart-btn">
            <button
              class="cart__btn wishlist"
              id="add-to-wishlist"
              onclick="wishlist();updateWishlistCount();"
            >
              Add to Wishlist
            </button>
            <button
              class="cart__btn cart"
              id="add-to-cart"
              onclick="addtocart();updateCartCount();"
            >
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </section>
    <div class="product-desc container">
      <div class="wrapper tabbed">
        <!-- Nav Links -->
        <nav class="nav-wrap">
          <ul class="ul-wrapper">
            <li class="active">
              <a
                href="#product-description"
                class="tabbed-trigger"
                data-id="product-description"
                ><span>Product Details</span></a
              >
            </li>
            <li>
              <a
                href="#product-review"
                class="tabbed-trigger"
                data-id="product-review"
                ><span>Reviews</span></a
              >
            </li>
          </ul>
        </nav>

        <!-- Product Description -->
        <div id="product-description" class="product-about active">
          <h2 id="product-title"></h2>
          <p id="product-desc"></p>
        </div>

        <!-- Reviews Section -->
        <div id="product-review" class="product-about">
          <div class="review-wrapper">
            <!-- <h2>Rating & Review</h2> -->
            <div class="head-review">
              <div class="sum-rating">
                <strong id="average-rating"></strong>
                <span id="total-reviews"></span>
              </div>
              <button class="btn" id="write-review">Write a Review</button>
            </div>
            <div class="body-review" id="review-container"></div>
          </div>
        </div>
      </div>
    </div>

    <h1 id="heading1">You may also like them</h1>
    <div class="product-section">
      <div id="newarrival-container" class="product-container"></div>
    </div>
    <!-- Footer section  starts-->
    <div id="footer"></div>
    <!-- Footer section  ends-->
    <button id="btnScrollToTop">
      <i class="fa-solid fa-arrow-up"></i>
    </button>
    <script>
      const btnScrollToTop = document.querySelector("#btnScrollToTop");
      btnScrollToTop.addEventListener("click", function () {
        window.scrollTo(0, 0);
      });
      async function loadNav() {
        try {
          const response = await fetch("/header");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("nav").innerHTML = data;
          // ("Navigation loaded successfully");
        } catch (error) {
          // console.error("Error loading navigation:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("nav").innerHTML =
            "<p>Failed to load navigation.</p>";
        }
      }
      async function loadFooter() {
        try {
          const response = await fetch("/footer");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("footer").innerHTML = data;
          // console.log("Footer loaded successfully");
        } catch (error) {
          // console.error("Error loading footer:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("footer").innerHTML =
            "<p>Failed to load footer.</p>";
        }
      }
      document.addEventListener("DOMContentLoaded", loadNav);
      document.addEventListener("DOMContentLoaded", loadFooter);

      document
        .getElementById("quantity")
        .addEventListener("keydown", function (e) {
          // Allow arrow keys (left, up, right, down)
          if (
            e.key === "ArrowUp" ||
            e.key === "ArrowDown" ||
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight"
          ) {
            return;
          }
          // Prevent other keys
          e.preventDefault();
        });
    </script>
    <script src="../js2/search.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js2/prodetail.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
