<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whishlist</title>
    <!-- custom css link -->
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      table,
      th,
      td {
        border: 1px solid #ddd;
      }

      th,
      td {
        padding: 15px;
        text-align: center;
      }

      th {
        background-color: #4caf50;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      /* Product Image */
      td img {
        width: 50px;
        height: auto;
        border-radius: 5px;
      }

      /* Buttons */
      button {
        padding: 8px 12px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
        transition: background 0.3s;
      }

      button.remove {
        background-color: #ff4d4d;
        color: white;
      }

      button.remove:hover {
        background-color: #cc0000;
      }

      button.add-cart {
        background-color: #28a745;
        color: white;
      }

      button.add-cart:hover {
        background-color: #1e7e34;
      }

      /* Cart Page Styles */
      .wishlist-items {
        padding: 1rem;
      }

      .wishlist-item {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #ddd;
        padding: 1rem 0;
      }

      .wishlist-item img {
        width: 100px;
        height: auto;
        margin-right: 1rem;
      }

      .wishlist-item-actions button {
        background: #ff4d4d;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }

      .wishlist-item-actions button:hover {
        background: #ff1a1a;
      }
      #message {
        font-size: large;
        margin-top: 30px;
        margin-left: 20px;
        color: rgba(255, 0, 0, 0.555);
      }
    </style>
  </head>

  <body>
    <!-- Header section starts -->
    <div id="nav"></div>
    <!-- Header section ends -->
    <!-- Whishlsit section starts -->
    <section id="wishlist-items" class="wishlist-items conatiner">
      <h1 id="message">Your Whishlist:</h1>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Name</th>
            <th>Price</th>
            <th>Action</th>
            <th>Add</th>
          </tr>
        </thead>
        <tbody id="wishlist-container"></tbody>
        <!-- ✅ Now inside <table> -->
      </table>
      <!-- Cart items will be dynamically loaded here -->
    </section>
    <!-- whishlist section ends -->
    <br /><br />
    <!-- Footer section  starts-->
    <div id="footer"></div>
    <!-- Footer section  ends-->
    <button id="btnScrollToTop">
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script>
      const btnScrollToTop = document.querySelector("#btnScrollToTop");
      btnScrollToTop.addEventListener("click", function () {
        window.scrollTo(0, 0);
      });
      async function loadNav() {
        try {
          const response = await fetch("/header");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("nav").innerHTML = data;
          console.log("Navigation loaded successfully");
        } catch (error) {
          console.error("Error loading navigation:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("nav").innerHTML =
            "<p>Failed to load navigation.</p>";
        }
      }
      async function loadFooter() {
        try {
          const response = await fetch("/footer");
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.text();
          document.getElementById("footer").innerHTML = data;
          console.log("Footer loaded successfully");
        } catch (error) {
          console.error("Error loading footer:", error);
          // Optionally, you can show an error message to the user
          document.getElementById("footer").innerHTML =
            "<p>Failed to load footer.</p>";
        }
      }
      document.addEventListener("DOMContentLoaded", loadNav);
      document.addEventListener("DOMContentLoaded", loadFooter);
    </script>
    <!-- Custom JS -->
    <script src="../js2/search.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
    <script src="../js/main.js"></script>
    <script src="../js2/wishlist.js"></script>
  </body>
</html>
